[Service]
# ollama 0.33 запускает llama-server с prompt cache в RAM до 8192 МиБ (дефолт llama.cpp).
# На 7.6 ГБ RAM и MemoryMax=6G кэш промптов (~465 МиБ на запрос) доводит до OOM-kill
# посреди батча (2026-09-25 02:09). llama-server читает LLAMA_ARG_* из окружения.
Environment=LLAMA_ARG_CACHE_RAM=0
