# Кураторские якоря серии «Бренд X ушёл — чем заменить в России»
# (app:seo:replace-listicle, docs/foreign_brands_policy.md → раздел «Фрейминг»).
# ТОЛЬКО ручная курация по реальному спросу — НЕ автогенерация сотней
# (scaled-content риск). Люкс (Chanel/Hermes/Cartier) не добавлять.
# Перед добавлением якоря проверять ФАКТ ухода из РФ (leave-russia.org, копия в
# ~/seo-archives/leave-russia/): Lacoste/Ecco/Geox/Guess/Kappa/Columbia/Fila/Lotto/
# Pepe Jeans/Diesel (Stay/Continue Operations)/Vans/Timberland/The North Face
# (VF Corp: Stay/Scaling Back) НЕ уходили — под «чем заменить» не годятся
# (фактчек 2026-07-07, docs/foreign_brands_policy.md → «Фактчек „кто реально ушёл"»).
