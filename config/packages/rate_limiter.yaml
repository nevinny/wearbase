framework:
    rate_limiter:
        # Агент-API приёма контента (/api/v1): защита от долбёжки при утечке токена.
        agent_api:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Голоса краудсорс-валидации (анонимные посетители): анти-флуд.
        brand_vote:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # Outreach-трекинг (/e/*): пиксель/клик/отписка из писем.
        outreach_track:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Трекинг исходящих кликов на ссылки бренда (/go/*): анти-долбёжка по IP.
        outbound_click:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Разовая оплата услуг (напр. «Размещение под ключ» 5000₽): защита от мусорных
        # платежей/долбёжки эндпоинта создания платежа YooKassa.
        service_pay:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # AI-ассист добавления вещи в гардероб (фото/URL → LLM): per-user анти-абьюз,
        # поверх — общий дневной потолок инсталляции (WardrobeAiMeter, api_usage_daily).
        wardrobe_ai:
            policy: sliding_window
            limit: 30
            interval: '1 day'

        wardrobe_ingest:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        native_auth_login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        native_auth_refresh:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

        # Гостевые ссылки луков /l/{token}: анти-брутфорс секретного токена по IP.
        look_share:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

        # Инвайт-акцепт кружков /account/circles/join/{token}: анти-брутфорс
        # секретного токена по паре token+IP.
        circle_join:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

# В тестах дневное окно wardrobe_ai живёт в var/cache/test МЕЖДУ прогонами
# (тест-БД одноразовая → user id повторяются) — после ~30 прогонов сьют
# начинает флейкать 429. Лимитер в тестах отключаем.
when@test:
    framework:
        rate_limiter:
            wardrobe_ai:
                policy: no_limit
            wardrobe_ingest:
                policy: no_limit
            native_auth_login:
                policy: no_limit
            native_auth_refresh:
                policy: no_limit
            look_share:
                policy: no_limit
            circle_join:
                policy: no_limit
