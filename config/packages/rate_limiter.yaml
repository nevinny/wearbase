framework:
    rate_limiter:
        # Агент-API приёма контента (/api/v1): защита от долбёжки при утечке токена.
        agent_api:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Голоса краудсорс-валидации (анонимные посетители): анти-флуд.
        brand_vote:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # Outreach-трекинг (/e/*): пиксель/клик/отписка из писем.
        outreach_track:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Трекинг исходящих кликов на ссылки бренда (/go/*): анти-долбёжка по IP.
        outbound_click:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # AI-ассист добавления вещи в гардероб (фото/URL → LLM): per-user анти-абьюз,
        # поверх — общий дневной потолок инсталляции (WardrobeAiMeter, api_usage_daily).
        wardrobe_ai:
            policy: sliding_window
            limit: 30
            interval: '1 day'

# В тестах дневное окно wardrobe_ai живёт в var/cache/test МЕЖДУ прогонами
# (тест-БД одноразовая → user id повторяются) — после ~30 прогонов сьют
# начинает флейкать 429. Лимитер в тестах отключаем.
when@test:
    framework:
        rate_limiter:
            wardrobe_ai:
                policy: no_limit
