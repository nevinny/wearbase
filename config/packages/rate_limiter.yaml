framework:
    rate_limiter:
        # Агент-API приёма контента (/api/v1): защита от долбёжки при утечке токена.
        agent_api:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Голоса краудсорс-валидации (анонимные посетители): анти-флуд.
        brand_vote:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # Outreach-трекинг (/e/*): пиксель/клик/отписка из писем.
        outreach_track:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Трекинг исходящих кликов на ссылки бренда (/go/*): анти-долбёжка по IP.
        outbound_click:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
