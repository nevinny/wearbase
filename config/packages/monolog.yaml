monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - telegram # клики по inline-кнопкам бота — всегда пишем в свой файл (мимо fingers_crossed)
        - wardrobe_ai # ошибки AI-подсказок гардероба (фото/ссылка) — свой файл, мимо fingers_crossed

when@dev:
    monolog:
        handlers:
            # rotating_file, а не stream: единый dev.log никогда не ротировался и дорос до
            # 1,5 ГБ за 9 месяцев (2025-11-05 → 2026-07-31). На Mac это ещё и внешний том.
            # Крон тикает раз в минуту, 66% объёма — http_client.INFO (каждый исходящий
            # запрос RAG/GSC/ollama), т.е. само по себе объём не уймётся: нужен лимит.
            main:
                type: rotating_file
                max_files: 7
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!deprecation"]
            # deprecation — в свой файл, ровно как уже сделано в when@prod ниже: в main это
            # давало 27% объёма при пяти повторяющихся сообщениях.
            deprecation:
                type: rotating_file
                max_files: 3
                path: "%kernel.logs_dir%/deprecation.log"
                level: info
                channels: [deprecation]
            telegram:
                type: stream
                path: "%kernel.logs_dir%/telegram.log"
                level: info
                channels: [telegram]
            wardrobe_ai:
                type: stream
                path: "%kernel.logs_dir%/wardrobe_ai.log"
                level: info
                channels: [wardrobe_ai]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!telegram", "!wardrobe_ai"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            telegram:
                type: stream
                path: "%kernel.logs_dir%/telegram.log"
                level: info
                channels: [telegram]
            wardrobe_ai:
                type: stream
                path: "%kernel.logs_dir%/wardrobe_ai.log"
                level: info
                channels: [wardrobe_ai]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!telegram"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
