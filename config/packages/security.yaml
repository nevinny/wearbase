security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_CUSTOMER:      [ROLE_USER]
        ROLE_BRAND_MANAGER: [ROLE_USER]
        ROLE_BRAND_OWNER:   [ROLE_BRAND_MANAGER, ROLE_USER]

    providers:
        # Провайдер для /admin (nevinny admin-core)
        admin_user_provider:
            entity:
                class: Nevinny\AdminCoreBundle\Entity\User
                property: email

        # Провайдер для front-end (покупатели + менеджеры брендов)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # /admin — отдельный firewall, свой User
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_user_provider
            form_login:
                login_path: admincore_login
                check_path: admincore_login
                default_target_path: admin
                enable_csrf: true
            logout:
                path: admincore_logout
                target: admincore_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /admin
                # Отдельное имя cookie: иначе на /admin браузер шлёт и фронтовый
                # REMEMBERME (path=/), и админский, а $_COOKIE оставляет одно значение —
                # админская валидация ловит чужой токен и «запомнить меня» не работает.
                name: REMEMBERME_ADMIN

        # Основной front-end firewall (покупатели + менеджеры брендов)
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: account_dashboard
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler
            login_throttling:
                max_attempts: 5
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /

    access_control:
        # Агент-API приёма контента: PUBLIC_ACCESS на уровне firewall, bearer-токен +
        # HMAC-подпись тела проверяются в контроллере (паттерн платёжных вебхуков).
        - { path: ^/api/v1, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/login,        roles: PUBLIC_ACCESS }
        - { path: ^/register,     roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/cart/count,   roles: PUBLIC_ACCESS }
        - { path: ^/payment/yookassa/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/telegram/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/payment/subscribe, roles: ROLE_BRAND_MANAGER }
        - { path: ^/invite/accept, roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/brand-data,   roles: PUBLIC_ACCESS } # голоса краудсорс-валидации (анонимы; ДО ^/brand — префикс!)
        - { path: ^/e/,           roles: PUBLIC_ACCESS } # outreach-трекинг: пиксель/клик/отписка из писем
        - { path: ^/go/,          roles: PUBLIC_ACCESS } # трекинг исходящих кликов на ссылки бренда (редирект-прокладка)
        - { path: ^/brand-claim,  roles: ROLE_USER }
        - { path: ^/brands,       roles: PUBLIC_ACCESS } # публичный A-Z индекс /brands/a-z (ДО ^/brand — префикс!)
        - { path: ^/brand,        roles: ROLE_BRAND_MANAGER }
        - { path: ^/account,      roles: ROLE_USER }
        - { path: ^/checkout,     roles: IS_AUTHENTICATED_REMEMBERED }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
