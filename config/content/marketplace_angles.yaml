# Углы серии «уход с маркетплейсов / прямые продажи» для app:seo:marketplace-article.
# Каждый угол → пара статей (site + dzen) с общей базой имени mp-{slug}.
# fact_refs — подстроки claim из marketplace_exit_facts.yaml (фильтр MarketplaceExitContext::
# factsForAngle): подтягиваются ТОЛЬКО подходящие факты (E-E-A-T, никаких opinion).
# persona — B2B-редакционные роли (аналитик e-commerce / консультант по маркетплейсам /
# основатель бренда), НЕ fashion-стилисты: серия про экономику продаж, не про моду.

angles:
  - slug: fz-289
    title: "289-ФЗ: что меняется для продавцов маркетплейсов с 1 октября 2026"
    brief: >-
      Разбор ключевых норм закона о платформенной экономике (289-ФЗ) для продавцов:
      уведомление об изменении комиссий и условий за 45 дней, запрет скидки за счёт
      продавца без согласия, требование прозрачно раскрывать условия. Что это меняет
      в планировании юнит-экономики бренда.
    fact_refs:
      - "289-ФЗ"
      - "45 дней"
      - "скидку за счёт продавца"
    persona: "аналитик e-commerce"

  - slug: komissii-2026
    title: "Комиссии маркетплейсов в 2026: как менялись ставки для продавцов одежды"
    brief: >-
      Хроника изменения комиссий за 2025–2026: серия повышений Ozon, синхронный шаг
      Яндекс.Маркета, «топливное» повышение Wildberries с наибольшим ростом для одежды.
      Как считать юнит-экономику при плавающих ставках.
    fact_refs:
      - "Ozon повысил комиссию"
      - "топливное"
      - "Яндекс.Маркет поднял комиссии"
    persona: "консультант по маркетплейсам"

  - slug: dbs-dorogo
    title: "DBS дороже всех: почему собственная доставка на Wildberries стала невыгодной"
    brief: >-
      Почему при повышении комиссий Wildberries сильнее всего выросла ставка на доставку
      силами продавца (DBS) и что это значит для брендов, привыкших возить самостоятельно.
      Когда собственная доставка перестаёт окупаться.
    fact_refs:
      - "DBS"
    persona: "консультант по маркетплейсам"

  - slug: fas-wb
    title: "Что ФАС изменила в правилах Wildberries"
    brief: >-
      Отмена практики «индекс остатка» (принудительное снижение цены, повышенное хранение,
      вывоз товара) по рекомендации экспертного совета при ФАС. Что это меняет для
      ценообразования и складского планирования продавца.
    fact_refs:
      - "индекс остатка"
    persona: "аналитик e-commerce"

  # highest-risk: тема о китайских продавцах чувствительна — публиковать ПОСЛЕ
  # регуляторных углов (fz-289, fas-wb, komissii-2026), когда серия уже набрала доверие.
  - slug: china-pop
    title: "Условия для китайских продавцов на Wildberries: чем они отличаются"
    brief: >-
      Фактический разбор льготного режима China POP: пониженная комиссия, бонус на
      продвижение, FBS-логистика со складов Китая/Гонконга, выплаты в юанях, а также
      требования к регистрации и входной взнос. Только факты, без оценок.
    fact_refs:
      - "China POP"
      - "китайский поставщик"
    persona: "аналитик e-commerce"

  - slug: yamarket-fashion
    title: "Яндекс.Маркет и подписка для fashion: что это значит для брендов одежды"
    brief: >-
      Запуск подписки для продавцов одежды на Яндекс.Маркете, снижающей комиссию, как
      попытка закрепиться в fashion. Что подписочная модель меняет в расчётах бренда и
      кому она подходит.
    fact_refs:
      - "Яндекс.Маркет запустил подписку"
      - "одежды"
    persona: "консультант по маркетплейсам"

  - slug: pryamye-prodazhi
    title: "Прямые продажи бренд-покупатель: как это работает без комиссии с продаж"
    brief: >-
      Как устроена модель прямых продаж, где деньги за заказ идут напрямую бренду, без
      комиссии платформы с каждой продажи (см. docs/payments.md): бренд принимает оплату
      на свой счёт через свою платёжку, платформа лишь витрина и подписка. Чем это
      отличается от маркетплейс-модели для юнит-экономики.
    fact_refs: []
    persona: "основатель бренда"

  - slug: kuda-uhodyat
    title: "Куда уходят бренды с маркетплейсов в 2026"
    brief: >-
      Обзорная статья: на фоне роста комиссий бренды одежды ищут каналы с предсказуемой
      экономикой — собственные сайты, прямые продажи бренд-покупатель без комиссии с
      продаж, каталоги-витрины. Что учитывать при переходе.
    fact_refs:
      - "Ozon повысил комиссию"
      - "топливное"
      - "Яндекс.Маркет поднял комиссии"
    persona: "основатель бренда"
