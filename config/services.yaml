# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.admin_email: '%env(ADMIN_EMAIL)%'
    app.telegram_bot_username: 'wearbase_bot'
    # Дефолты опциональных env (чтобы приложение грузилось без записи в .env)
    env(ADMIN_TELEGRAM_CHAT_ID): ''
    env(VK_APP_ID): ''
    env(VK_APP_SECRET): ''
    env(BRAND_CLAIM_AUTOGRANT_EMAIL): '1'
    env(BRAND_CLAIM_AUTOGRANT_VK): '1'
    env(PAYMENT_SECRET_KEY): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Платёжные шлюзы помечаем тегом — реестр собирает их через TaggedIterator
    _instanceof:
        App\Payment\Gateway\PaymentGatewayInterface:
            tags: ['app.payment_gateway']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\LlmService:
        arguments:
            $apiKey: '%env(OPENROUTER_API_KEY)%'
            $model: '%env(OPENROUTER_MODEL)%'
            $localUrl: '%env(LOCAL_LLM_URL)%'
            $localModel: '%env(LOCAL_LLM_MODEL)%'

    App\Service\EmbeddingService:
        arguments:
            $embedUrl: '%env(LOCAL_EMBED_URL)%'
            $embedModel: '%env(LOCAL_EMBED_MODEL)%'

    App\Service\VectorStoreService:
        arguments:
            $qdrantUrl: '%env(QDRANT_URL)%'
            $qdrantApiKey: '%env(QDRANT_API_KEY)%'
            $collection: '%env(QDRANT_COLLECTION)%'

    App\Service\UrlFilter:
        arguments:
            $extraExcludedDomains: '%env(SCRAPE_EXCLUDED_DOMAINS)%'

    App\Service\SearxClient:
        arguments:
            $searxUrl: '%env(SEARXNG_URL)%'

    App\Service\Agent\BrandIngestService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Agent\BrandPayloadAssembler:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\DatapointVoteService:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Service\IndexNowPinger:
        arguments:
            $indexNowKey: '%env(default::INDEXNOW_KEY)%'

    App\Service\Gsc\GscClient:
        arguments:
            $credentialsPath: '%env(default::GSC_CREDENTIALS_PATH)%'
            $siteUrl: '%env(default::GSC_SITE_URL)%'

    App\Command\PushBrandsCommand:
        arguments:
            $prodApiUrl: '%env(default::PROD_API_URL)%'
            $apiToken:   '%env(default::AGENT_API_TOKEN)%'
            $apiSecret:  '%env(default::AGENT_API_SECRET)%'

    App\Service\WebScraperService:
        arguments:
            $trafilaturaBin: '%env(TRAFILATURA_BIN)%'

    App\Service\Keyword\WordstatClient:
        arguments:
            $apiKey: '%env(WORDSTAT_API_KEY)%'

    App\Service\Keyword\KeywordProviderInterface: '@App\Service\Keyword\WordstatClient'

    App\Notification\TelegramNotifier:
        arguments:
            $botToken: '%env(TELEGRAM_BOT_TOKEN)%'

    App\Notification\AdminNotifier:
        arguments:
            $adminChatId: '%env(ADMIN_TELEGRAM_CHAT_ID)%'

    App\Service\PaymentService:
        arguments:
            $shopId: '%env(YOOKASSA_SHOP_ID)%'
            $secretKey: '%env(YOOKASSA_SECRET_KEY)%'

    App\Service\SecretCipher:
        arguments:
            $key: '%env(PAYMENT_SECRET_KEY)%'

    App\Service\BrandClaimService:
        arguments:
            # Авто-выдача доступа при сильной верификации (можно отключить без правки кода)
            $autoGrantEmail: '%env(bool:BRAND_CLAIM_AUTOGRANT_EMAIL)%'
            $autoGrantVk: '%env(bool:BRAND_CLAIM_AUTOGRANT_VK)%'

    App\Service\VkVerifier:
        arguments:
            $appId: '%env(VK_APP_ID)%'
            $appSecret: '%env(VK_APP_SECRET)%'

    App\Service\DeliveryService:
        arguments:
            $cdekAccount: '%env(CDEK_ACCOUNT)%'
            $cdekPassword: '%env(CDEK_PASSWORD)%'
            $boxberryToken: '%env(BOXBERRY_TOKEN)%'

    App\Command\MigrateImagesToSubdirsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ImageDownloaderService:
        arguments:
            $publicDir: '%kernel.project_dir%/public'
