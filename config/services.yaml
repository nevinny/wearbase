# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.admin_email: '%env(ADMIN_EMAIL)%'
    app.telegram_bot_username: 'wearbase_bot'
    # Дефолты опциональных env (чтобы приложение грузилось без записи в .env)
    env(ADMIN_TELEGRAM_CHAT_ID): ''
    env(VK_APP_ID): ''
    env(VK_APP_SECRET): ''
    env(BRAND_CLAIM_AUTOGRANT_EMAIL): '1'
    env(BRAND_CLAIM_AUTOGRANT_VK): '1'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\LlmService:
        arguments:
            $apiKey: '%env(OPENROUTER_API_KEY)%'
            $model: '%env(OPENROUTER_MODEL)%'

    App\Notification\TelegramNotifier:
        arguments:
            $botToken: '%env(TELEGRAM_BOT_TOKEN)%'

    App\Notification\AdminNotifier:
        arguments:
            $adminChatId: '%env(ADMIN_TELEGRAM_CHAT_ID)%'

    App\Service\PaymentService:
        arguments:
            $shopId: '%env(YOOKASSA_SHOP_ID)%'
            $secretKey: '%env(YOOKASSA_SECRET_KEY)%'

    App\Service\BrandClaimService:
        arguments:
            # Авто-выдача доступа при сильной верификации (можно отключить без правки кода)
            $autoGrantEmail: '%env(bool:BRAND_CLAIM_AUTOGRANT_EMAIL)%'
            $autoGrantVk: '%env(bool:BRAND_CLAIM_AUTOGRANT_VK)%'

    App\Service\VkVerifier:
        arguments:
            $appId: '%env(VK_APP_ID)%'
            $appSecret: '%env(VK_APP_SECRET)%'

    App\Service\DeliveryService:
        arguments:
            $cdekAccount: '%env(CDEK_ACCOUNT)%'
            $cdekPassword: '%env(CDEK_PASSWORD)%'
            $boxberryToken: '%env(BOXBERRY_TOKEN)%'

    App\Command\MigrateImagesToSubdirsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\GenerateBrandDeepseekCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ImageDownloaderService:
        arguments:
            $publicDir: '%kernel.project_dir%/public'
