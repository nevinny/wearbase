# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.admin_email: '%env(ADMIN_EMAIL)%'
    app.telegram_bot_username: 'wearbase_bot'
    app.wardrobe_draft_storage_dir: '%kernel.project_dir%/var/uploads/wardrobe_drafts'
    # Дефолты опциональных env (чтобы приложение грузилось без записи в .env)
    env(ADMIN_TELEGRAM_CHAT_ID): ''
    env(VK_APP_ID): ''
    env(VK_APP_SECRET): ''
    env(BRAND_CLAIM_AUTOGRANT_EMAIL): '1'
    env(BRAND_CLAIM_AUTOGRANT_VK): '1'
    env(PAYMENT_SECRET_KEY): ''
    env(WEB_PUSH_PUBLIC_KEY): ''
    env(WEB_PUSH_PRIVATE_KEY): ''
    env(WEB_PUSH_SUBJECT): 'mailto:admin@wearbase.ru'
    # Гардероб авто-ингест: 0=remote vision (WARDROBE_VISION_MODEL, работает на проде),
    # 1=local vision на LLM-сервере (dev/.env.local, где достаётся риг — бесплатно).
    env(WARDROBE_VISION_LOCAL): '0'
    env(WARDROBE_OUTFIT_LOCAL): '0'
    env(WARDROBE_OUTFIT_LOCAL_MODEL): 'gemma4:26b'
    # Соц-автоматизация: дрип-рамп (предохранитель)
    env(SOCIAL_LAUNCH_DATE): ''
    env(SOCIAL_START_RATE): '3'
    env(SOCIAL_CAP): '14'
    # UTM-клик-инжестер (Ф0 closed-loop, app:social:ingest-clicks): нет токена API Метрики —
    # источник кликов nginx-логи прода через ssh+zgrep. Дефолты — реальные прод-пути.
    env(SOCIAL_CLICK_LOG_HOST): 'regru'
    env(SOCIAL_CLICK_LOG_GLOB): '/var/www/u3042786/data/logs/wearbase.ru.access.log*'
    env(GEMINI_API_KEY): ''
    env(CLOUDFLARE_ACCOUNT_ID): ''
    env(CLOUDFLARE_AI_TOKEN): ''
    # Движки SearXNG для автоматики discover (толерантные к объёму с одного IP).
    env(SEARX_ENGINES): 'bing,mojeek'
    # Официальный Yandex Search API v2 (доп-источник discover). Пусто = выключен.
    # Нужен ОТДЕЛЬНЫЙ ключ Yandex Cloud (роль search-api.webSearch.user) + folderId.
    env(YANDEX_SEARCH_API_KEY): ''
    env(YANDEX_SEARCH_FOLDER_ID): ''
    # Дневной потолок запросов к платному Yandex Search API (fail-closed). 0 = без лимита.
    env(YANDEX_SEARCH_DAILY_CAP): '2000'
    # Brave Search API (доп-источник discover, fallback-добор). Пусто = выключен.
    # Free-tier 1000 запросов/МЕСЯЦ (сброс ежемесячно) → строгий месячный потолок.
    env(BRAVE_SEARCH_API_KEY): ''
    env(BRAVE_SEARCH_MONTHLY_CAP): '1000'
    # QA-гейт сгенерированного контента (article-qa-toolkit). '0' = выключить.
    env(ARTICLE_QA_ENABLED): '1'
    # RAG-стек и Wordstat: живут в .env.local (на проде пустые) — дефолты, чтобы
    # контейнер собирался и app:health:env работал без записей в .env
    env(WORDSTAT_API_KEY): ''
    env(LOCAL_LLM_URL): ''
    env(QDRANT_URL): ''
    env(QDRANT_API_KEY): ''
    env(SEARXNG_URL): ''
    # Канонический хост сайта для canonical/hreflang (не зависит от request-хоста)
    env(SITE_BASE_URL): 'https://wearbase.ru'
    app.site_base_url: '%env(SITE_BASE_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Платёжные шлюзы помечаем тегом — реестр собирает их через TaggedIterator
    _instanceof:
        App\Payment\Gateway\PaymentGatewayInterface:
            tags: ['app.payment_gateway']
        App\Social\Publisher\SocialPublisherInterface:
            tags: ['app.social_publisher']
        App\Service\Social\Source\CaptionSourceInterface:
            tags: ['app.social_caption_source']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Notification\WebPushPublisherInterface: '@App\Notification\WebPushPublisher'

    App\Notification\WebPushPublisher:
        arguments:
            $publicKey: '%env(WEB_PUSH_PUBLIC_KEY)%'
            $privateKey: '%env(WEB_PUSH_PRIVATE_KEY)%'
            $subject: '%env(WEB_PUSH_SUBJECT)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\LlmService:
        arguments:
            $apiKey: '%env(OPENROUTER_API_KEY)%'
            $model: '%env(OPENROUTER_MODEL)%'
            $localUrl: '%env(LOCAL_LLM_URL)%'
            $localModel: '%env(LOCAL_LLM_MODEL)%'
            $proxyUrl: '%env(OPENROUTER_PROXY_URL)%'
            $proxyAuth: '%env(OPENROUTER_PROXY_AUTH)%'

    App\Service\EmbeddingService:
        arguments:
            $embedUrl: '%env(LOCAL_EMBED_URL)%'
            $embedModel: '%env(LOCAL_EMBED_MODEL)%'

    App\Service\VectorStoreService:
        arguments:
            $qdrantUrl: '%env(QDRANT_URL)%'
            $qdrantApiKey: '%env(QDRANT_API_KEY)%'
            $collection: '%env(QDRANT_COLLECTION)%'

    # Отдельный инстанс векторного хранилища для базы знаний (коллекция topic_chunks),
    # тот же Qdrant/размерность, что brand_chunks. Только для app:kb:ingest-channels.
    app.vector_store.topic:
        class: App\Service\VectorStoreService
        arguments:
            $qdrantUrl: '%env(QDRANT_URL)%'
            $qdrantApiKey: '%env(QDRANT_API_KEY)%'
            $collection: 'topic_chunks'

    App\Service\Knowledge\KnowledgeChannelRegistry:
        arguments:
            $yamlPath: '%kernel.project_dir%/config/knowledge/channels.yaml'

    App\Service\Knowledge\KnowledgeIngestor:
        arguments:
            $vectors: '@app.vector_store.topic'

    App\Service\Advisor\AdvisorRag:
        arguments:
            $vectors: '@app.vector_store.topic'

    App\Service\UrlFilter:
        arguments:
            $extraExcludedDomains: '%env(SCRAPE_EXCLUDED_DOMAINS)%'

    App\Service\MarketplaceExitContext:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Social\Source\DepartedCaptionSource:
        arguments:
            $yamlPath: '%kernel.project_dir%/config/social/departed_brands.yaml'

    App\Service\Social\SlideTextBudget:
        arguments:
            $fontPath: '%kernel.project_dir%/config/social/fonts/NotoSans.ttf'

    # Лестница хуков H1 (departed) читает тот же сид ушедших брендов, что DepartedCaptionSource.
    App\Service\Social\SlideScriptComposer:
        arguments:
            $departedYamlPath: '%kernel.project_dir%/config/social/departed_brands.yaml'

    App\Service\ArticleQaService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $enabled: '%env(bool:ARTICLE_QA_ENABLED)%'

    App\Service\YandexSearchMeter:
        arguments:
            $dailyCap: '%env(int:YANDEX_SEARCH_DAILY_CAP)%'

    App\Service\WardrobeAiMeter:
        arguments:
            $dailyCap: '%env(int:WARDROBE_AI_DAILY_CAP)%'

    App\Service\Wardrobe\WardrobeAiService:
        arguments:
            $visionModel: '%env(WARDROBE_VISION_MODEL)%'
            $visionLocal: '%env(bool:WARDROBE_VISION_LOCAL)%'
            $localModel: '%env(LOCAL_LLM_MODEL)%'

    App\Service\Wardrobe\WardrobeIngestHealth:
        arguments:
            $storageDir: '%app.wardrobe_draft_storage_dir%'

    App\Service\Wardrobe\WardrobeOutfitService:
        arguments:
            $remoteModel: '%env(OPENROUTER_MODEL)%'
            $localModel: '%env(WARDROBE_OUTFIT_LOCAL_MODEL)%'
            $localFirst: '%env(bool:WARDROBE_OUTFIT_LOCAL)%'

    App\Service\YandexSearchClient:
        arguments:
            $apiKey: '%env(YANDEX_SEARCH_API_KEY)%'
            $folderId: '%env(YANDEX_SEARCH_FOLDER_ID)%'

    App\Service\BraveSearchMeter:
        arguments:
            $monthlyCap: '%env(int:BRAVE_SEARCH_MONTHLY_CAP)%'

    App\Service\BraveSearchClient:
        arguments:
            $apiKey: '%env(BRAVE_SEARCH_API_KEY)%'

    App\Service\SearxClient:
        arguments:
            $searxUrl: '%env(SEARXNG_URL)%'
            # Курируемый список движков для автоматики discover — толерантные к объёму
            # с одного egress-IP. brave/yandex/google рейтлимятся/каптчатся под нагрузкой
            # (Google режет бот-сигнатуру SearXNG, не IP), поэтому массово их НЕ дёргаем
            # (остаются доступны в UI SearXNG). Дефолт в .env; пусто = все дефолтные движки.
            $engines: '%env(SEARX_ENGINES)%'

    App\Service\LogoFetcher:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Agent\BrandIngestService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Agent\BrandPayloadAssembler:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\DatapointVoteService:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Service\IndexNowPinger:
        arguments:
            $indexNowKey: '%env(default::INDEXNOW_KEY)%'

    App\Service\Gsc\GscClient:
        arguments:
            $credentialsPath: '%env(default::GSC_CREDENTIALS_PATH)%'
            $siteUrl: '%env(default::GSC_SITE_URL)%'

    App\Service\Gsc\GoogleIndexingClient:
        arguments:
            $credentialsPath: '%env(default::GSC_CREDENTIALS_PATH)%'

    App\Service\Yandex\YandexWebmasterClient:
        arguments:
            $apiKey: '%env(default::YANDEX_WEBMASTER_API_KEY)%'
            $host:   '%env(default::YANDEX_WEBMASTER_HOST)%'

    App\Command\PushBrandsCommand:
        arguments:
            $prodApiUrl: '%env(default::PROD_API_URL)%'
            $apiToken:   '%env(default::AGENT_API_TOKEN)%'
            $apiSecret:  '%env(default::AGENT_API_SECRET)%'

    App\Service\Agent\ProdBrandPusher:
        arguments:
            $prodApiUrl: '%env(default::PROD_API_URL)%'
            $apiToken:   '%env(default::AGENT_API_TOKEN)%'
            $apiSecret:  '%env(default::AGENT_API_SECRET)%'

    App\Command\ModerateTickCommand:
        arguments:
            $prodApiUrl: '%env(default::PROD_API_URL)%'
            $apiToken:   '%env(default::AGENT_API_TOKEN)%'
            $apiSecret:  '%env(default::AGENT_API_SECRET)%'

    App\Service\WebScraperService:
        arguments:
            $trafilaturaBin: '%env(TRAFILATURA_BIN)%'

    App\Service\Keyword\WordstatClient:
        arguments:
            $apiKey: '%env(WORDSTAT_API_KEY)%'

    App\Service\Keyword\KeywordProviderInterface: '@App\Service\Keyword\WordstatClient'

    App\Mailer\RusenderTransportFactory:
        tags: ['mailer.transport_factory']

    App\Notification\TelegramNotifier:
        arguments:
            $botToken: '%env(TELEGRAM_BOT_TOKEN)%'

    App\Service\Telegram\TelegramFileFetcher:
        arguments:
            $botToken: '%env(TELEGRAM_BOT_TOKEN)%'

    App\Notification\AdminNotifier:
        arguments:
            $adminChatId: '%env(ADMIN_TELEGRAM_CHAT_ID)%'

    App\Service\PaymentService:
        arguments:
            $shopId: '%env(YOOKASSA_SHOP_ID)%'
            $secretKey: '%env(YOOKASSA_SECRET_KEY)%'

    App\Service\SecretCipher:
        arguments:
            $key: '%env(PAYMENT_SECRET_KEY)%'

    App\Service\BrandClaimService:
        arguments:
            # Авто-выдача доступа при сильной верификации (можно отключить без правки кода)
            $autoGrantEmail: '%env(bool:BRAND_CLAIM_AUTOGRANT_EMAIL)%'
            $autoGrantVk: '%env(bool:BRAND_CLAIM_AUTOGRANT_VK)%'

    App\Service\VkVerifier:
        arguments:
            $appId: '%env(VK_APP_ID)%'
            $appSecret: '%env(VK_APP_SECRET)%'

    App\Service\DeliveryService:
        arguments:
            $cdekAccount: '%env(CDEK_ACCOUNT)%'
            $cdekPassword: '%env(CDEK_PASSWORD)%'
            $boxberryToken: '%env(BOXBERRY_TOKEN)%'

    App\EventListener\AgentReadyListener:
        arguments:
            $siteBaseUrl: '%app.site_base_url%'

    App\Command\SeoTechAuditCommand:
        arguments:
            $siteBaseUrl: '%app.site_base_url%'

    App\Command\MigrateImagesToSubdirsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ImageDownloaderService:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    # --- Соц-автоматизация (docs/marketing_instagram.md) ---
    App\Service\Social\CaptionGenerator:
        arguments:
            $siteBaseUrl: '%app.site_base_url%'

    App\Service\Social\MediaRenderer:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $cfAccountId: '%env(CLOUDFLARE_ACCOUNT_ID)%'
            $cfApiToken: '%env(CLOUDFLARE_AI_TOKEN)%'

    App\Social\Publisher\TelegramPublisher:
        arguments:
            $botToken: '%env(TELEGRAM_BOT_TOKEN)%'

    # Брендированная карточка для IG-рубрик-шаблонов (вместо слабой AI-сцены) — точечная добавка,
    # не меняет существующий MediaRenderer/TG/VK.
    App\Service\Social\CardImageRenderer:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $fontPath: '%kernel.project_dir%/config/social/fonts/NotoSans.ttf'

    # Нормализация фото брендов в слайды одного холста (IG кадрирует всю карусель по первому
    # слайду) + слайд с логотипом для A/B «логотип первым/последним».
    App\Service\Social\GallerySlideRenderer:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $fontPath: '%kernel.project_dir%/config/social/fonts/NotoSans.ttf'

    # Те же слайды → mp4-слайдшоу для Reels (ffmpeg, холст 9:16, тишина в аудиодорожке).
    App\Service\Social\ReelsSlideshowRenderer:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Вендорный CRUD админов (nevinny/admin-core) не имеет configureFields: EasyAdmin
    # генерил поля из метаданных и выводил колонку `password` текстовым полем с bcrypt-хешем,
    # а сохранение писало введённое без хеширования. Снимаем автоконфигурацию, чтобы
    # EasyAdmin его не видел — маршруты /admin/user/* обслуживает App\Controller\Admin\UserCrudController.
    Nevinny\AdminCoreBundle\Controller\Admin\UserCrudController:
        autoconfigure: false
        autowire: false
